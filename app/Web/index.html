<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Veil · 指纹浏览器</title>
<link rel="stylesheet" href="app.css">
<style>
  /* 关键路径样式：避免首帧白屏 */
  html,body{margin:0;padding:0;background:#0d0f14;color:#e6e9f0;height:100%;overflow:hidden}
  #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:#0d0f14;z-index:9999;transition:opacity .25s}
  #boot .ring{width:34px;height:34px;border:2.5px solid #232838;border-top-color:#6c8cff;border-radius:50%;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  #boot .t{font:500 12px/1 -apple-system,"PingFang SC",sans-serif;color:#8b93a7;letter-spacing:.08em}
  #boot.gone{opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="boot"><div class="ring"></div><div class="t">VEIL LOADING</div></div>

<div id="app" class="app hidden">
  <!-- 顶部标题条（可拖动区域） -->
  <header id="titlebar">
    <div class="tb-left">
      <div class="logo">
        <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true">
          <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#7c9cff"/><stop offset="100%" stop-color="#b06cff"/></linearGradient></defs>
          <path d="M12 2.2 4.4 5.3v6.1c0 4.6 3.1 8.9 7.6 10.4 4.5-1.5 7.6-5.8 7.6-10.4V5.3L12 2.2Z"
                fill="url(#lg)" opacity=".18"/>
          <path d="M12 2.2 4.4 5.3v6.1c0 4.6 3.1 8.9 7.6 10.4 4.5-1.5 7.6-5.8 7.6-10.4V5.3L12 2.2Z"
                fill="none" stroke="url(#lg)" stroke-width="1.5" stroke-linejoin="round"/>
          <path d="M8.7 11.9l2.4 2.4 4.3-4.6" fill="none" stroke="url(#lg)" stroke-width="1.7"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="tb-title">Veil<span class="tb-ver" id="tbVer">1.0.0</span></div>
    </div>
    <div class="tb-center" id="tbSearchWrap">
      <div class="tb-search">
        <svg viewBox="0 0 20 20" width="13" height="13"><path fill="currentColor" d="M8.5 3a5.5 5.5 0 0 1 4.38 8.82l3.4 3.4-1.06 1.06-3.4-3.4A5.5 5.5 0 1 1 8.5 3Zm0 1.5a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z"/></svg>
        <input id="globalSearch" type="search" placeholder="搜索窗口 / 备注 / 序号 / 代理…" spellcheck="false" autocomplete="off">
        <kbd>⌘K</kbd>
      </div>
    </div>
    <div class="tb-right">
      <div class="tb-stat" id="tbStat" title="运行中 / 总数">
        <span class="dot dot-live"></span><b id="tbRunning">0</b><span class="sep">/</span><span id="tbTotal">0</span>
      </div>
      <button class="icon-btn" id="btnProbe" title="重新探测本机指纹">
        <svg viewBox="0 0 20 20" width="14" height="14"><path fill="currentColor" d="M10 2a8 8 0 1 1-5.66 2.34l1.06 1.06A6.5 6.5 0 1 0 10 3.5V6L6.5 3 10 0v2Z"/></svg>
      </button>
      <button class="icon-btn" id="btnLogs" title="运行日志">
        <svg viewBox="0 0 20 20" width="14" height="14"><path fill="currentColor" d="M4 3h12a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Zm1.5 3v1.4h9V6h-9Zm0 3.3v1.4h9V9.3h-9Zm0 3.3v1.4h6v-1.4h-6Z"/></svg>
      </button>
    </div>
  </header>

  <!-- 侧边栏 -->
  <nav id="sidebar">
    <div class="nav-section">
      <button class="nav-item active" data-view="profiles">
        <svg viewBox="0 0 20 20" width="15" height="15"><path fill="currentColor" d="M3 3.5A1.5 1.5 0 0 1 4.5 2h6.09c.4 0 .78.16 1.06.44l4.91 4.91c.28.28.44.66.44 1.06V16.5A1.5 1.5 0 0 1 15.5 18h-11A1.5 1.5 0 0 1 3 16.5v-13ZM10 3.5v4h4l-4-4Z"/></svg>
        <span>窗口</span><em id="navCountProfiles">0</em>
      </button>
      <button class="nav-item" data-view="running">
        <svg viewBox="0 0 20 20" width="15" height="15"><path fill="currentColor" d="M4 4h8a2 2 0 0 1 2 2v1h2a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2v-1H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Zm0 1.5A.5.5 0 0 0 3.5 6v8a.5.5 0 0 0 .5.5h2V9a2 2 0 0 1 2-2h4V6a.5.5 0 0 0-.5-.5H4Z"/></svg>
        <span>运行中</span><em id="navCountRunning">0</em>
      </button>
      <button class="nav-item" data-view="groups">
        <svg viewBox="0 0 20 20" width="15" height="15"><path fill="currentColor" d="M2 4.5A1.5 1.5 0 0 1 3.5 3h3.6c.4 0 .78.16 1.06.44L9.3 4.6h7.2A1.5 1.5 0 0 1 18 6.1v9.4a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 2 15.5v-11Z"/></svg>
        <span>分组</span><em id="navCountGroups">0</em>
      </button>
      <button class="nav-item" data-view="templates">
        <svg viewBox="0 0 20 20" width="15" height="15"><path fill="currentColor" d="M3 3h6v6H3V3Zm8 0h6v6h-6V3ZM3 11h6v6H3v-6Zm8 0h6v6h-6v-6Z"/></svg>
        <span>指纹模板</span><em id="navCountTemplates">0</em>
      </button>
    </div>
    <div class="nav-section">
      <button class="nav-item" data-view="detect">
        <svg viewBox="0 0 20 20" width="15" height="15"><path fill="currentColor" d="M10 1.5 3 4.4v5.2c0 4.3 2.9 8.3 7 9.9 4.1-1.6 7-5.6 7-9.9V4.4L10 1.5Zm0 5.2a3.3 3.3 0 1 1 0 6.6 3.3 3.3 0 0 1 0-6.6Z"/></svg>
        <span>指纹检测</span>
      </button>
      <button class="nav-item" data-view="api">
        <svg viewBox="0 0 20 20" width="15" height="15"><path fill="currentColor" d="M7.6 3.3 3 8l4.6 4.7-1.1 1L1.3 8.6 6.5 3.3l1.1 1Zm4.8 0 5.2 5.3-5.2 5.1-1.1-1L15.9 8l-4.6-4.7 1.1-1Z"/></svg>
        <span>本地 API</span><em class="pill" id="navApiPort">54345</em>
      </button>
      <button class="nav-item" data-view="settings">
        <svg viewBox="0 0 20 20" width="15" height="15"><path fill="currentColor" d="M10 6.8a3.2 3.2 0 1 1 0 6.4 3.2 3.2 0 0 1 0-6.4Zm7.3 4.3.1-1.1-.1-1.1 1.6-1.3-1.6-2.8-2 .7a7.3 7.3 0 0 0-1.9-1.1L12 2.5H8.8l-.4 2a7.3 7.3 0 0 0-1.9 1.1l-2-.7L2.9 7.7l1.6 1.3-.1 1.1.1 1.1-1.6 1.3 1.6 2.8 2-.7c.6.5 1.2.8 1.9 1.1l.4 2H12l.4-2c.7-.3 1.3-.6 1.9-1.1l2 .7 1.6-2.8-1.6-1.3Z"/></svg>
        <span>设置</span>
      </button>
    </div>

    <div class="nav-spacer"></div>

    <div class="host-card" id="hostCard">
      <div class="hc-title">本机指纹基线</div>
      <div class="hc-row"><span>Chrome</span><b id="hcChrome">—</b></div>
      <div class="hc-row"><span>GPU</span><b id="hcGpu" class="ellipsis">—</b></div>
      <div class="hc-row"><span>时区</span><b id="hcTz">—</b></div>
      <div class="hc-row"><span>字体</span><b id="hcFonts">—</b></div>
      <button class="hc-btn" id="hcProbe">重新探测</button>
    </div>
  </nav>

  <!-- 主内容 -->
  <main id="content"></main>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script src="app.js"></script>
</body>
</html>
